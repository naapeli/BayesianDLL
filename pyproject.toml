[project]
name = "bayesiandll"
version = "0.1.0"
description = "Bayesian modelling in PyTorch: graphical models sampled with NUTS, Gibbs and SMC, variational inference and Gaussian processes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cycler>=0.11",
    "loky>=3.5.6",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "torch>=2.6",
    "tqdm>=4.64",
]

[project.optional-dependencies]
arviz = ["arviz>=1.3.0; python_version >= '3.12'"]

[dependency-groups]
dev = [
    # ArviZ 1.3 needs Python 3.12; the tests that compare against it skip without it.
    "arviz>=1.3.0; python_version >= '3.12'",
    "pyro-api==0.1.2",
    "pyro-ppl==1.9.1",
    "pytest>=9.1.1",
    "scipy>=1.15.2",
]
docs = [
    "sphinx>=8.2",
    "sphinx-rtd-theme>=3.0",
    "sphinx-gallery>=0.19",
    # needed by the parallel gallery build (GALLERY_JOBS)
    "joblib>=1.3",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.11" }

[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: sampling and optimization checks against analytic targets",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["BayesianDLL*"]
