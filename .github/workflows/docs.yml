name: Deploy Sphinx Documentation to GitHub Pages

on:
  # Rebuild and deploy the docs on every push to the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer run cancels an older one
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev --group docs

      # sphinx-gallery re-runs only the examples whose own source changed, so
      # the executed output is reused only when nothing the examples depend
      # on (library, examples, dependencies, docs configuration) changed.
      # There is deliberately no restore-keys fallback to an older cache.
      - name: Restore executed gallery
        uses: actions/cache@v4
        with:
          path: |
            Docs/source/auto_examples
            Docs/source/gen_modules
          key: gallery-${{ runner.os }}-${{ hashFiles('BayesianDLL/**', 'examples/**', 'uv.lock', 'Docs/source/conf.py') }}

      - name: Build Sphinx documentation
        run: uv run --no-sync make -C Docs html SPHINXOPTS="--keep-going"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Docs/build/html
          name: sphinx-docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: sphinx-docs
